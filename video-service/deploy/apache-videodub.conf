# ============================================================================
# 芥末种子 video-service —— Apache 反向代理片段（HTTPS 域名 → 本机 FastAPI）
#
# 用法：把下面的指令合并进「已经在监听 10085 且带 HTTPS 证书」的那个
#       <VirtualHost *:10085>（与现有 /var/www/html/new 页面共存），
#       不要整个替换。改完执行：
#         sudo a2enmod proxy proxy_http headers
#         sudo apache2ctl configtest && sudo systemctl reload apache2
#
# 后端由 systemd 跑在 127.0.0.1:8765（service.json 保持 host=127.0.0.1，
# 不直接对公网开放，只通过 Apache 这一个入口暴露）。
# ============================================================================

# ---- 大视频上传：默认 60s 代理超时会掐断上传，放开体积与超时 ----
LimitRequestBody 0
ProxyTimeout 3600
Timeout 3600

# ---- 关键：目标地址必须保留 /api 前缀 ----
# 后端的路由本身就是 /api/health、/api/upload……，
# 若照网上常见写法在目标末尾加斜杠（...:8765/）会把 /api 剥掉，导致 404。
ProxyPreserveHost On
ProxyPass        /api http://127.0.0.1:8765/api
ProxyPassReverse /api http://127.0.0.1:8765/api

# ---- 可选：对外暴露交互式接口文档 ----
ProxyPass        /docs        http://127.0.0.1:8765/docs
ProxyPassReverse /docs        http://127.0.0.1:8765/docs
ProxyPass        /openapi.json http://127.0.0.1:8765/openapi.json
ProxyPassReverse /openapi.json http://127.0.0.1:8765/openapi.json

# ----------------------------------------------------------------------------
# 不要在这里加 “Header set Access-Control-Allow-Origin ...”：
# 后端 CORSMiddleware 已按请求返回该头（默认 cors_origins=["*"]），
# Apache 再写一份会产生【重复 CORS 头】，浏览器直接判跨域失败。
# 想收紧来源时，改后端 service.json 的 cors_origins，例如：
#   "cors_origins": ["https://lxt-promise.github.io"]
# ----------------------------------------------------------------------------
