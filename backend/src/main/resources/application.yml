server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: music-admin
  datasource:
    url: jdbc:h2:file:./data/musicdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.music.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# File upload directory
music:
  upload-dir: ./uploads
  file-base-url: http://localhost:8080/api/files
  # 智谱 AI（GLM）大模型配置
  # api-key 优先读环境变量 AI_API_KEY；也可直接把密钥写在下面
  ai:
    enabled: true
    api-key: ${AI_API_KEY:67eb8fcad9dd43d7bf9a79fb862dff34.NXIqbMScEEc6w0oZ}
    # glm-4.7-flash 为思考模型；若提示“访问量过大/429”可换免费高并发档 glm-4-flash（并设 thinking-enabled: false）
    model: glm-4.7-flash
    # 默认系统提示词（请求中传 systemPrompt 可覆盖）
    system-prompt: "你是「音乐管家」的 AI 助手，熟悉音乐知识、歌曲、歌手与歌单管理。请用简洁友好的中文回答用户问题，并可结合音乐场景给出建议。"
    max-tokens: 4096
    temperature: 0.8
    # 深度思考开关（glm-4-flash 等非思考模型需设为 false）
    thinking-enabled: true
